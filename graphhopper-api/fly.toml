# fly.toml app configuration file generated for velo-club-web on 2026-05-06T06:55:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paceline-graphhopper'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/graphhopper/data'

[http_service]
  internal_port = 8989
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8989
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  ports = []

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
